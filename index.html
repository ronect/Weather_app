<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Weather App</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h1>Weather App</h1>
    </header>

    <main>
      <div id="main-container">
        <!-- Search -->
        <form id="weather-form">
          <label for="city">Search City</label>
          <input type="text" id="city" placeholder="Enter a city" required />

          <button type="submit">Search</button>
        </form>

        <!-- Current Weather -->
        <section class="weather-container">
          <div class="current-weather">
            <h2 id="location">City</h2>
            <p id="condition">Weather condition</p>

            <p id="temperature">--°</p>

            <p id="condition">
              Pressure: <span id="pressure"></span> | humidity:
              <span id="humidity"> </span>
            </p>
            <p id="today-line">
              <span id="today"></span><strong> Today</strong>
            </p>
          </div>

          <!-- Extra Weather Information -->
          <div class="hourly-weather">
            <ul id="hourly-list">
              <!--  <li>
                <p>Now</p>
                <div class="img-container">
                  <img id="img-0" src="allie.png" />
                </div>
                <p id="description-0">0</p>
              </li>-->
            </ul>
          </div>

          <div class="upcoming-weather">
            <ul>
              <li>
                <strong class="day">Today</strong>
                <div class="img-container">
                  <img id="today-img" src="allie.png" />
                </div>
                <strong><span id="today-temp">6</span> </strong>
              </li>
              <li>
                <strong class="day">Tomorrow</strong>
                <div class="img-container">
                  <img id="tomorrow-img" src="allie.png" />
                </div>
                <strong><span id="tomorrow-temp">-7</span> </strong>
              </li>
              <li>
                <strong class="day">Day Afrter tomorrow</strong>
                <div class="img-container">
                  <img id="day-after-tomorrow-img" src="allie.png" />
                </div>
                <strong><span id="af-tomorrow-temp">6</span> </strong>
              </li>
            </ul>
          </div>
        </section>
      </div>
    </main>

    <script src="main.js"></script>
  </body>
</html>
