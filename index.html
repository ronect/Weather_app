<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Weather App</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h1>Weather App</h1>
    </header>

    <main>
      <div id="main-container">
        <!-- Search -->
        <form id="weather-form">
          <label for="city">Search City</label>
          <input type="text" id="city" placeholder="Enter a city" required />

          <button type="submit">Search</button>
        </form>

        <!-- Current Weather -->
        <section class="weather-container">
          <h2 id="location">City</h2>

          <div class="current-weather">
            <p id="condition">Weather condition</p>
            <img id="weather-icon" src="" alt="Weather condition" />

            <p id="temperature">--°</p>

            <p id="condition">
              Pressure: <span id="pressure"></span> | humidity:
              <span id="humidity"> </span>
            </p>
            <p><span id="Today"></span><strong> Today</strong></p>
          </div>

          <!-- Extra Weather Information -->
          <div class="weather-details">
            <div>
              <h3>Feels Like</h3>
              <p id="feels-like">--°</p>
            </div>

            <div></div>

            <div>
              <h3>Wind</h3>
              <p id="wind">-- mph</p>
            </div>
          </div>
        </section>
      </div>
    </main>

    <script src="main.js"></script>
  </body>
</html>
