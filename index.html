<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Weather App</title>

    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Shadows+Into+Light&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header>
      <h1>Weather App</h1>
    </header>

    <main>
      <div id="main-container">
        <!-- Search -->
        <form id="weather-form">
          <label for="city">
            <h2>Search City</h2>
          </label>

          <input type="text" id="city" placeholder="Enter a city" required />

          <button type="submit">Search</button>
        </form>

        <p id="error-message"></p>

        <!-- Weather -->
        <section class="weather-container hidden">
          <!-- Current Weather -->
          <div class="current-weather">
            <h2 id="location">City</h2>

            <p id="condition">Weather condition</p>

            <p id="temperature">--°</p>

            <p>
              Pressure: <span id="pressure"></span> | Humidity:
              <span id="humidity"></span>
            </p>

            <p id="today-line">
              <span id="today"></span>
              <strong>Today</strong>
            </p>
          </div>

          <!-- Hourly Weather -->
          <div class="hourly-weather">
            <ul id="hourly-list"></ul>
          </div>

          <!-- Upcoming Weather -->
          <div class="upcoming-weather">
            <ul>
              <li>
                <strong class="day">Today</strong>

                <div class="img-container">
                  <img id="today-img" alt="Today's weather" />
                </div>

                <strong>
                  <span id="today-temp"></span>
                </strong>
              </li>

              <li>
                <strong class="day">Tomorrow</strong>

                <div class="img-container">
                  <img id="tomorrow-img" alt="Tomorrow's weather" />
                </div>

                <strong>
                  <span id="tomorrow-temp"></span>
                </strong>
              </li>

              <li>
                <strong class="day">Day After Tomorrow</strong>

                <div class="img-container">
                  <img
                    id="day-after-tomorrow-img"
                    alt="Day after tomorrow's weather"
                  />
                </div>

                <strong>
                  <span id="af-tomorrow-temp"></span>
                </strong>
              </li>
            </ul>
          </div>
        </section>
      </div>
    </main>

    <script src="main.js"></script>
  </body>
</html>
